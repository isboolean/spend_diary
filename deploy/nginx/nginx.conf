upstream spend_diary_api {
    server server:8080;
}

upstream spend_diary_admin {
    server admin-web:80;
}

server {
    listen 80;
    server_name _;

    # TODO: 生产环境挂载证书后启用 443，并将 80 重定向到 https

    location /api/ {
        proxy_pass http://spend_diary_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://spend_diary_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
