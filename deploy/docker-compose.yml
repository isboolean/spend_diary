services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-spend_diary_root}
      MYSQL_DATABASE: spend_diary
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-spend_diary_root}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build: ../server
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/spend_diary?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-spend_diary_root}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  admin-web:
    build: ../admin-web
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
      - admin-web
    restart: unless-stopped

volumes:
  mysql-data:
