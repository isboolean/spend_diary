spring:
  application:
    name: spend-diary-server
  profiles:
    default: dev
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    expiration: 604800

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/spend_diary?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:199811}
    driver-class-name: com.mysql.cj.jdbc.Driver

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/spend_diary?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:spend_diary_root}
    driver-class-name: com.mysql.cj.jdbc.Driver
